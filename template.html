/* ============================ Sheet & Tabs ============================ */
const sheet = document.getElementById("sheet");
function setSheet(state){ sheet.dataset.state = state; }
function showTab(name){
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.tab === name)));
  document.querySelectorAll(".panel").forEach(p =>
    p.id === "panel-" + name ? p.setAttribute("data-active", "") : p.removeAttribute("data-active"));
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  showTab(t.dataset.tab);
  if (sheet.dataset.state === "peek") setSheet("half");
}));

(function dragSheet(){
  const grip = document.getElementById("grip");
  let y0 = 0, dragging = false;
  const order = ["peek", "half", "full"];
  const start = e => { dragging = true; y0 = (e.touches ? e.touches[0].clientY : e.clientY); };
  const end = e => {
    if (!dragging) return;
    dragging = false;
    const y1 = (e.changedTouches ? e.changedTouches[0].clientY : e.clientY);
    const dy = y1 - y0;
    let i = order.indexOf(sheet.dataset.state);
    if (i < 0) i = 0;
    if (dy < -40) i = Math.min(order.length - 1, i + 1);
    else if (dy > 40) i = Math.max(0, i - 1);
    else i = sheet.dataset.state === "full" ? 1 : (i === 0 ? 1 : i);
    setSheet(order[i]);
  };
  grip.addEventListener("touchstart", start, {passive:true});
  grip.addEventListener("touchend", end);
  grip.addEventListener("mousedown", start);
  window.addEventListener("mouseup", e => { if (dragging) end(e); });
})();

document.getElementById("btn-kw").addEventListener("click", () => {
  kwMode = !kwMode;
  try { localStorage.setItem("blindsee-kw", kwMode ? "1" : "0"); } catch(e){}
  document.getElementById("btn-kw").setAttribute("aria-pressed", String(kwMode));
  document.body.classList.toggle("kw", kwMode);
  document.getElementById("sheet-sub").textContent = kwMode
    ? "Kinderwagen-Modus: Rastpunkte und Schiebestellen werden angezeigt"
    : "Alle Touren sind Runden — Start = Ziel";
  // Im Kinderwagen-Modus die unproblematischste Runde nach vorn holen
  if (kwMode){
    const best = ROUTES.filter(r => r.stroller_grade !== "red")
                       .sort((a, b) => (a.stroller_grade === "green" ? -1 : 1) - (b.stroller_grade === "green" ? -1 : 1))[0];
    renderRoutes();
    selectRoute(best || activeRoute || ROUTES[0], {fly:true});
  } else {
    renderRoutes();
    selectRoute(activeRoute || ROUTES[0], {fly:false});
  }
  if (sheet.dataset.state === "peek") setSheet("half");
});

document.getElementById("btn-reset").addEventListener("click", () => {
  if (tourOn) exitTour();
  activeSpot = null; showTab("routes"); setSheet("half");
  selectRoute(activeRoute || ROUTES[0], {fly:true});
});

/* ============================ Tour-Assistent ============================ */
const QUESTIONS = [
  {
    key:"size", q:"Wie groß soll die Runde sein?",
    hint:"Jede Tour ist ein geschlossener Rundweg — du kommst dort an, wo du gestartet bist. Nur die Größe unterscheidet sich.",
    multi:false,
    options:[
      {v:"mini",  t:"Kleine Runde",    d:"rund 1,5 km · etwa 25 Minuten",  i:"🚶"},
      {v:"kurz",  t:"Kurze Runde",     d:"rund 2 km · etwa 40 Minuten",    i:"🥾"},
      {v:"see",   t:"Einmal um den See", d:"rund 3,5 km · etwa 1 Stunde",  i:"🌊"},
      {v:"gross", t:"Große Runde",     d:"rund 6 km · etwa 2 Stunden",     i:"⛰"},
      {v:"pano",  t:"Panorama-Runde",  d:"rund 8 km · etwa 3 Stunden",     i:"🏔"}
    ]
  },
  {
    key:"who", q:"Wer ist dabei?",
    hint:"Das entscheidet, welche Wege überhaupt in Frage kommen — Belag, Treppen und Steigung.",
    multi:false,
    options:[
      {v:"stroller", t:"Mit Kinderwagen",   d:"nur befestigte Wege ohne Stufen", i:"👶"},
      {v:"kids",     t:"Mit kleinen Kindern", d:"kurz, flach, viel zu entdecken", i:"🧒"},
      {v:"dog",      t:"Mit Hund",          d:"schattig und mit Wasserzugang",   i:"🐕"},
      {v:"adults",   t:"Erwachsene",        d:"keine Einschränkung",             i:"🧑"},
      {v:"fit",      t:"Sportlich unterwegs", d:"Steigung ist ausdrücklich erwünscht", i:"🏃"}
    ]
  },
  {
    key:"slope", q:"Wie viel Steigung ist okay?",
    hint:"Am Blindsee sind kurze steile Rampen üblich — hier legst du fest, wie viel davon du willst.",
    multi:false,
    options:[
      {v:"flat", t:"Möglichst flach",      d:"kaum Höhenmeter, gleichmäßig",   i:"➖"},
      {v:"some", t:"Etwas bergauf ist fein", d:"moderate Anstiege sind okay",  i:"📈"},
      {v:"any",  t:"Egal, Hauptsache schön", d:"Höhenmeter spielen keine Rolle", i:"⛰"}
    ]
  },
  {
    key:"want", q:"Worauf habt ihr Lust?",
    hint:"Mehrfachauswahl möglich. Danach wird gewichtet, welche Runde am besten passt.",
    multi:true,
    options:[
      {v:"water", t:"Ans Wasser",          d:"möglichst viel direkt am Ufer",   i:"🏖"},
      {v:"view",  t:"Aussicht & Fotos",    d:"Panoramablicke, Höhenpunkte",     i:"📷"},
      {v:"shade", t:"Schatten & Wald",     d:"kühl auch bei Sonne",             i:"🌲"},
      {v:"spots", t:"Viel sehen",          d:"möglichst viele markierte Orte",  i:"🧭"},
      {v:"quiet", t:"Ruhe",                d:"abseits von Parkplatz und Straße", i:"🤫"}
    ]
  }
];

let wizStep = 0;
let QS = QUESTIONS;
const answers = {size:null, who:null, slope:null, want:[]};

function openWizard(){
  // Mit Kinderwagen stehen Begleitung und Steigungstoleranz bereits fest -
  // zwei Fragen weniger statt vier Mal dasselbe zu beantworten.
  if (kwMode){
    answers.who = "stroller";
    answers.slope = "flat";
    QS = QUESTIONS.filter(q => q.key !== "who" && q.key !== "slope");
  } else {
    QS = QUESTIONS;
  }
  wizStep = 0;
  document.getElementById("wizard").hidden = false;
  drawWizard();
}
function closeWizard(){ document.getElementById("wizard").hidden = true; }

function drawWizard(){
  const q = QS[wizStep];
  document.getElementById("wiz-no").textContent = `Schritt ${wizStep + 1} von ${QS.length}`;
  document.getElementById("wiz-q").textContent = q.q;
  document.getElementById("wiz-hint").textContent = q.hint;
  document.getElementById("wiz-bar").style.width = ((wizStep + 1) / QS.length * 100) + "%";
  document.getElementById("wiz-back").style.visibility = wizStep === 0 ? "hidden" : "visible";
  document.getElementById("wiz-next").textContent =
    wizStep === QS.length - 1 ? "Runde vorschlagen" : "Weiter";

  const cur = answers[q.key];
  document.getElementById("wiz-body").innerHTML = q.options.map(o => {
    const on = q.multi ? (cur || []).includes(o.v) : cur === o.v;
    return `<button class="opt ${on ? "on" : ""}" data-v="${o.v}">
      <span class="opt-ico">${o.i}</span>
      <span class="opt-main"><span class="opt-t">${o.t}</span><span class="opt-d">${o.d}</span></span>
      <span class="opt-check"></span></button>`;
  }).join("");

  document.getElementById("wiz-body").querySelectorAll(".opt").forEach(b =>
    b.addEventListener("click", () => {
      const v = b.dataset.v;
      if (q.multi){
        const arr = answers[q.key] || [];
        answers[q.key] = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v);
      } else {
        answers[q.key] = v;
      }
      drawWizard();
      updateNext();
    }));
  updateNext();
}

function updateNext(){
  const q = QS[wizStep];
  const cur = answers[q.key];
  const ok = q.multi ? true : !!cur;
  document.getElementById("wiz-next").disabled = !ok;
}

document.getElementById("wiz-next").addEventListener("click", () => {
  if (wizStep < QS.length - 1){ wizStep++; drawWizard(); }
  else { closeWizard(); applyWizard(); }
});
document.getElementById("wiz-back").addEventListener("click", () => {
  if (wizStep > 0){ wizStep--; drawWizard(); }
});
document.getElementById("wiz-close").addEventListener("click", closeWizard);
document.getElementById("open-wizard").addEventListener("click", openWizard);

/* --------- Bewertung: harte Anforderungen, dann gewichtete Wünsche --------- */
const BAND_ORDER = ["mini", "kurz", "see", "gross", "pano"];

function scoreRoutes(){
  const want = answers.want || [];
  const wantedIdx = BAND_ORDER.indexOf(answers.size);
  const results = [];

  for (const r of ROUTES){
    const reasons = [], blockers = [];

    // Harte Anforderungen
    if (answers.who === "stroller" && r.stroller_grade === "red")
      blockers.push(r.steps_m > 0 ? "Treppen — Wagen muss getragen werden"
                                  : "zu lange steile Abschnitte");
    if (answers.who === "kids" && (r.km > 4.5 || r.steep_share > 0.14))
      blockers.push("für kleine Kinder zu lang oder zu steil");
    if (answers.who === "dog" && !r.dog_ok)
      blockers.push("Treppen auf der Strecke");
    if (answers.slope === "flat" && r.steep_share > 0.12)
      blockers.push("zu viele steile Abschnitte");

    let score = 0;

    // Passung zur gewünschten Größe (Nachbarklassen zählen abgeschwächt)
    const idx = BAND_ORDER.indexOf(r.id);
    const gap = Math.abs(idx - wantedIdx);
    score += gap === 0 ? 40 : gap === 1 ? 22 : gap === 2 ? 8 : 0;
    if (gap === 0) reasons.push("entspricht genau der gewünschten Rundenlänge");
    else if (gap === 1) reasons.push("etwas " + (idx > wantedIdx ? "länger" : "kürzer") + " als gewünscht");

    // Steigung
    if (answers.slope === "flat"){
      score += Math.max(0, 18 - r.steep_share * 120);
      if (r.steep_share < 0.05) reasons.push("durchgehend flach");
    } else if (answers.slope === "some"){
      score += r.ascent_m > 40 && r.ascent_m < 200 ? 14 : 6;
    } else {
      score += Math.min(18, r.ascent_m / 14);
      if (r.ascent_m > 150) reasons.push(`${r.ascent_m} Höhenmeter`);
    }

    // Begleitung
    if (answers.who === "stroller"){
      if (r.stroller_grade === "green"){
        score += 18; reasons.push("mit Kinderwagen problemlos: fester Belag, keine Stufen");
      } else if (r.stroller_grade === "yellow"){
        score += 8; reasons.push("mit geländegängigem Wagen machbar");
      }
      if (r.benches >= 2){
        score += Math.min(10, r.benches * 2);
        reasons.push(`${r.benches} Bänke zum Pausieren unterwegs`);
      }
      score += r.shade_share * 12;
    }
    if (answers.who === "kids"){
      score += Math.max(0, 14 - r.km * 2);
      if (r.hotspots.length >= 3) { score += 8; reasons.push("unterwegs gibt es viel zu entdecken"); }
    }
    if (answers.who === "dog"){
      score += r.shade_share * 14 + r.lake_share * 10;
      if (r.shade_share > .3) reasons.push("viel Schatten für den Hund");
      if (r.lake_share > .4) reasons.push("Wasserzugang unterwegs");
    }
    if (answers.who === "fit") score += Math.min(14, r.ascent_m / 18);

    // Wünsche
    if (want.includes("water")){
      score += r.lake_share * 26;
      if (r.lake_share > .5) reasons.push(`${Math.round(r.lake_share*100)} % der Strecke direkt am Ufer`);
    }
    if (want.includes("shade")){
      score += r.shade_share * 24;
      if (r.shade_share > .3) reasons.push(`${Math.round(r.shade_share*100)} % durch Wald`);
    }
    if (want.includes("view")){
      score += Math.min(22, (r.highpoint_m - r.lowpoint_m) / 4);
      const views = r.hotspots.filter(id => (SPOT_BY_ID[id] || {}).category === "photo").length;
      score += views * 6;
      if (views) reasons.push(`${views} Aussichtspunkt${views > 1 ? "e" : ""} auf der Strecke`);
    }
    if (want.includes("spots")){
      score += r.hotspots.length * 5;
      if (r.hotspots.length >= 4) reasons.push(`${r.hotspots.length} markierte Orte unterwegs`);
    }
    if (want.includes("quiet")){
      score += (1 - r.lake_share) * 8 + r.shade_share * 10;
      if (r.shade_share > .4) reasons.push("ruhiger Waldweg abseits des Ufers");
    }

    results.push({route:r, score, reasons, blockers});
  }

  results.sort((a, b) =>
    (a.blockers.length - b.blockers.length) || (b.score - a.score));
  return results;
}

function applyWizard(){
  const res = scoreRoutes();
  const usable = res.filter(x => !x.blockers.length);
  const list = (usable.length ? usable : res).map(x => x.route);
  const reasons = {};
  (usable.length ? usable : res).forEach((x, i) => {
    if (i === 0){
      reasons[x.route.id] = `<b>Beste Übereinstimmung.</b> ` +
        (x.reasons.length ? x.reasons.join(" · ") : "passt zu deiner Auswahl") + ".";
    } else if (i < 3 && x.reasons.length){
      reasons[x.route.id] = x.reasons.slice(0, 2).join(" · ") + ".";
    }
    if (x.blockers.length){
      reasons[x.route.id] = `<b style="color:var(--amber)">Mit Einschränkung:</b> ${x.blockers.join(", ")}.`;
    }
  });

  showTab("routes");
  activeRoute = list[0];
  renderRoutes(list, reasons);
  selectRoute(list[0], {fly:true});
  setSheet("full");
  document.getElementById("sheet-sub").textContent =
    usable.length ? `${usable.length} von ${ROUTES.length} Runden passen zu deiner Auswahl`
                  : "Keine Runde erfüllt alle Kriterien — hier die nächstbesten";
}
