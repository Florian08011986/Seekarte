<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<title>Blindsee · Tourenkarte</title>
<meta name="description" content="Interaktive 3D-Karte mit echten Rundwegen rund um den Blindsee in Tirol.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
:root{
  --bg:#0d1117; --surface:#161b22; --surface-2:#1f262e; --line:#2b333d;
  --text:#e9eef5; --muted:#9aa7b5; --faint:#6b7885;
  --accent:#4aa8ff; --accent-soft:rgba(74,168,255,.14);
  --green:#3fb950; --amber:#d29922; --red:#f85149;
  --sheet-peek:112px; --safe-b:env(safe-area-inset-bottom,0px);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:10px}

/* ---------- Topbar ---------- */
.topbar{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
  gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
  background:linear-gradient(180deg,rgba(13,17,23,.92),rgba(13,17,23,0));pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;margin-right:auto;
  text-shadow:0 1px 6px rgba(0,0,0,.6)}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;background:rgba(22,27,34,.86);
  border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(12px);
  font-size:17px;line-height:1}
.icon-btn:active{transform:scale(.94)}
.cta{height:40px;padding:0 16px;border-radius:12px;background:var(--accent);color:#06121f;
  font-weight:700;font-size:13px;border:none;box-shadow:0 4px 16px rgba(74,168,255,.3)}
.cta:active{transform:scale(.96)}

/* ---------- Bottom sheet ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;
  height:78vh;transform:translateY(calc(78vh - var(--sheet-peek) - var(--safe-b)));
  transition:transform .32s cubic-bezier(.22,1,.36,1);will-change:transform;
  padding-bottom:var(--safe-b)}
.sheet[data-state="half"]{transform:translateY(38vh)}
.sheet[data-state="full"]{transform:translateY(0)}
.sheet[data-state="hidden"]{transform:translateY(100%)}
.grip-zone{padding:8px 0 4px;cursor:grab;touch-action:none;flex:none}
.grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto}

.sheet-head{padding:2px 16px 10px;flex:none}
.sheet-title{font-size:15px;font-weight:700;letter-spacing:-.01em}
.sheet-sub{font-size:12px;color:var(--muted);margin-top:2px}

.tabs{display:flex;gap:4px;padding:0 12px 10px;flex:none}
.tab{flex:1;height:34px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);
  background:var(--surface-2);border:1px solid transparent}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);
  border-color:rgba(74,168,255,.3)}
.panel{display:none;overflow-y:auto;padding:0 12px 20px;flex:1;-webkit-overflow-scrolling:touch}
.panel[data-active]{display:block}

/* ---------- Karten / Listen ---------- */
.card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 14px;margin-bottom:9px;transition:border-color .15s,background .15s}
.card:active{background:#252d36}
.card.selected{border-color:var(--accent);background:var(--accent-soft)}
.card-top{display:flex;align-items:baseline;gap:8px}
.card-name{font-size:14px;font-weight:700;letter-spacing:-.01em;flex:1}
.card-km{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.card-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.pill{font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;
  background:#0f151c;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--green);border-color:rgba(63,185,80,.3)}
.pill.warn{color:var(--amber);border-color:rgba(210,153,34,.3)}
.pill.hot{color:var(--accent);border-color:rgba(74,168,255,.3)}
.card-desc{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:8px}
.why{margin-top:9px;padding:8px 10px;border-radius:10px;background:rgba(63,185,80,.09);
  border:1px solid rgba(63,185,80,.22);font-size:12px;line-height:1.5;color:#b9e6c1}
.why b{color:var(--green)}

.row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--line);margin-bottom:8px}
.row:active{background:#252d36}
.row-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;background:#0f151c;border:1px solid var(--line);flex:none}
.row-main{flex:1;min-width:0}
.row-name{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.row-sub{font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.row-go{font-size:11px;font-weight:700;color:var(--accent);flex:none}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:11px 0}
.stat{background:#0f151c;border:1px solid var(--line);border-radius:11px;padding:9px 6px;text-align:center}
.stat-v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-l{font-size:9.5px;color:var(--faint);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

.profile{width:100%;height:58px;display:block;margin-top:4px}
.section-h{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;
  letter-spacing:.07em;margin:16px 0 8px}
.empty{padding:26px 14px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.6}

/* ---------- Kinderwagen-Modus ---------- */
.ampel{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:7px;border:1px solid var(--line);background:#0f151c}
.ampel::before{content:"";width:8px;height:8px;border-radius:99px;flex:none}
.ampel.green{color:var(--green);border-color:rgba(63,185,80,.35)}
.ampel.green::before{background:var(--green)}
.ampel.yellow{color:var(--amber);border-color:rgba(210,153,34,.35)}
.ampel.yellow::before{background:var(--amber)}
.ampel.red{color:var(--red);border-color:rgba(248,81,73,.35)}
.ampel.red::before{background:var(--red)}
.kw-note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:7px}

.tl{margin-top:8px;border-left:2px solid var(--line);padding-left:12px}
.tl-item{position:relative;padding:7px 0;font-size:12.5px;line-height:1.45}
.tl-item::before{content:"";position:absolute;left:-17px;top:13px;width:8px;height:8px;
  border-radius:99px;background:var(--line);border:2px solid var(--surface-2)}
.tl-item.warn::before{background:var(--amber)}
.tl-item.bad::before{background:var(--red)}
.tl-item.good::before{background:var(--green)}
.tl-km{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);margin-right:7px}
.tl-item b{font-weight:650}

.kw-toggle{position:relative}
.kw-toggle[aria-pressed="true"]{background:var(--accent);color:#06121f;border-color:var(--accent)}

/* Vereinfachte Bedienung: groessere Flaechen, weniger Gedraengtes */
body.kw .card{padding:16px 16px;border-radius:18px}
body.kw .card-name{font-size:16px}
body.kw .card-km{font-size:15px}
body.kw .card-desc{font-size:13.5px}
body.kw .row{padding:14px 13px}
body.kw .row-name{font-size:14.5px}
body.kw .row-sub{font-size:12.5px}
body.kw .tab{height:40px;font-size:14px}
body.kw .pill{font-size:12px;padding:4px 10px}
body.kw .opt{padding:16px 15px}
body.kw .opt-t{font-size:15.5px}
body.kw .opt-d{font-size:12.5px}
body.kw .btn{height:50px;font-size:15px}
body.kw .stat-v{font-size:16px}
body.kw .sheet-title{font-size:16.5px}

/* ---------- Filterleiste ---------- */
.filters{position:sticky;top:0;z-index:2;background:var(--surface);padding:2px 0 10px;
  margin-bottom:2px}
.frow{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.flabel{font-size:10px;font-weight:700;color:var(--faint);text-transform:uppercase;
  letter-spacing:.06em;margin:6px 0 2px}
.chip{flex:none;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:99px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent-soft);border-color:rgba(74,168,255,.45);color:var(--accent)}
.fcount{font-size:11.5px;color:var(--faint);padding:8px 2px 2px}
body.kw .chip{font-size:13.5px;padding:9px 14px}

/* ---------- Anpassen ---------- */
.opt-row{display:flex;align-items:center;gap:11px;padding:12px;border-radius:13px;
  background:var(--surface-2);border:1.5px solid transparent;margin-bottom:8px;width:100%;
  text-align:left}
.opt-row.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-row .r-main{flex:1;min-width:0}
.opt-row .r-t{font-size:13.5px;font-weight:650}
.opt-row .r-d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.opt-row .r-x{font-size:12px;font-weight:700;color:var(--accent);flex:none}
.delta{font-size:11.5px;font-weight:700;color:var(--amber)}
.addbar{display:flex;gap:7px;margin:8px 0 4px;flex-wrap:wrap}
.addbar .chip{flex:none}
.hint-box{font-size:12px;line-height:1.5;color:var(--muted);background:#0f151c;
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:8px 0}
.picking{outline:3px solid var(--accent);outline-offset:-3px}

/* ---------- Wizard ---------- */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(9,12,16,.93);
  backdrop-filter:blur(14px);display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.wiz{width:100%;max-width:520px;max-height:92vh;background:var(--surface);
  border:1px solid var(--line);border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding-bottom:var(--safe-b);animation:rise .3s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.wiz-head{padding:16px 18px 10px;flex:none;position:relative}
.wiz-step-no{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em;
  text-transform:uppercase}
.wiz-q{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.25;
  padding-right:34px}
.wiz-hint{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.5}
.wiz-x{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;
  background:var(--surface-2);display:grid;place-items:center;font-size:17px;color:var(--muted)}
.bar{height:3px;background:var(--surface-2);margin:0 18px;border-radius:99px;overflow:hidden;flex:none}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.wiz-body{padding:14px 18px 8px;overflow-y:auto;flex:1}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;
  background:var(--surface-2);border:1.5px solid transparent;margin-bottom:8px;width:100%;text-align:left}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt-ico{width:36px;height:36px;border-radius:11px;background:#0f151c;display:grid;
  place-items:center;font-size:17px;flex:none;border:1px solid var(--line)}
.opt-main{flex:1;min-width:0}
.opt-t{font-size:14px;font-weight:650;letter-spacing:-.01em}
.opt-d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.opt-check{width:21px;height:21px;border-radius:99px;border:2px solid var(--line);flex:none;
  display:grid;place-items:center}
.opt.on .opt-check{border-color:var(--accent);background:var(--accent)}
.opt.on .opt-check::after{content:"";width:8px;height:8px;border-radius:99px;background:#06121f}
.wiz-foot{display:flex;gap:9px;padding:12px 18px 16px;flex:none;border-top:1px solid var(--line)}
.btn{height:44px;border-radius:13px;font-size:14px;font-weight:700;padding:0 18px;
  display:grid;place-items:center}
.btn-ghost{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.btn-main{background:var(--accent);color:#06121f;flex:1;box-shadow:0 4px 16px rgba(74,168,255,.25)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- Bodenansicht ---------- */
.ground{position:absolute;inset:0;z-index:40;pointer-events:none;display:flex;
  flex-direction:column;justify-content:space-between}
.ground[hidden]{display:none}
.ground > *{pointer-events:auto}
.g-top{display:flex;align-items:center;gap:9px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;
  background:linear-gradient(180deg,rgba(9,12,16,.85),transparent)}
.g-chip{background:rgba(22,27,34,.9);border:1px solid var(--line);border-radius:12px;
  padding:8px 13px;backdrop-filter:blur(12px);max-width:62%}
.g-name{font-size:13.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.g-dir{font-size:11px;color:var(--accent);font-weight:600;margin-top:1px}
.g-spacer{flex:1}
.g-bottom{padding:12px 12px calc(var(--safe-b) + 14px);
  background:linear-gradient(0deg,rgba(9,12,16,.9),transparent);display:flex;gap:9px;align-items:flex-end}
.g-hint{flex:1;font-size:11.5px;color:var(--muted);background:rgba(22,27,34,.82);
  border:1px solid var(--line);border-radius:11px;padding:8px 11px;backdrop-filter:blur(10px);
  line-height:1.45;transition:opacity .5s}
.g-hint.fade{opacity:0}
.compass{width:46px;height:46px;border-radius:99px;background:rgba(22,27,34,.9);
  border:1px solid var(--line);display:grid;place-items:center;backdrop-filter:blur(12px);flex:none}
.compass-n{font-size:10px;font-weight:800;color:var(--red);transform-origin:center}
.photo-view{position:fixed;inset:0;z-index:70;background:#05080b;display:flex;
  flex-direction:column;align-items:center;justify-content:center}
.photo-view[hidden]{display:none}
.photo-view img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain}
.photo-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;
  padding:12px 12px calc(var(--safe-b) + 14px);background:linear-gradient(0deg,rgba(5,8,11,.95),transparent);
  font-size:11px;color:var(--muted)}
.photo-bar span{flex:1;line-height:1.4}
.t-bar{display:flex;align-items:center;gap:10px;background:rgba(22,27,34,.9);
  border:1px solid var(--line);border-radius:13px;padding:8px 12px;backdrop-filter:blur(10px)}
.t-play{width:34px;height:34px;border-radius:99px;background:var(--accent);color:#06121f;
  font-size:13px;font-weight:700;flex:none;display:grid;place-items:center}
.t-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;
  background:var(--line);outline:none}
.t-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:99px;
  background:var(--accent);border:3px solid #0d1117;cursor:pointer}
.t-slider::-moz-range-thumb{width:20px;height:20px;border-radius:99px;background:var(--accent);
  border:3px solid #0d1117;cursor:pointer}

.sh-strip{display:flex;gap:3px;align-items:flex-end;height:64px;margin:8px 0 4px}
.sh-cell{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  height:100%;border-radius:6px 6px 4px 4px;background:#0f151c;border:1px solid transparent;
  padding-bottom:2px;gap:2px}
.sh-cell.on{border-color:var(--accent);background:var(--accent-soft)}
.sh-bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,#4aa8ff,#2d6da8);
  display:block;min-height:3px}
.sh-h{font-size:8.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.sh-legend{font-size:13px;margin-top:4px}
.sh-legend b{color:var(--accent);font-size:15px}
body.kw .sh-strip{height:76px}
body.kw .sh-h{font-size:10px}

.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:50;
  background:rgba(9,12,16,.7);backdrop-filter:blur(6px);font-size:13px;color:var(--muted)}
.loading[hidden]{display:none}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--accent);
  border-radius:99px;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (min-width:760px){
  .sheet{left:auto;right:16px;bottom:16px;width:392px;height:min(78vh,720px);
    border-radius:20px;border:1px solid var(--line)}
  .sheet[data-state="peek"]{transform:translateY(calc(100% - var(--sheet-peek)))}
  .sheet[data-state="half"]{transform:translateY(34%)}
  .overlay{align-items:center}
  .wiz{border-radius:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>

<header class="topbar">
  <div class="brand">Blindsee<small id="brand-sub">Tirol · 1093 m</small></div>
  <button class="cta" id="open-wizard">Tour finden</button>
  <button class="icon-btn kw-toggle" id="btn-kw" aria-pressed="false"
          title="Kinderwagen-Modus">👶</button>
  <button class="icon-btn kw-toggle" id="btn-contour" aria-pressed="false"
          title="Höhenlinien">⛰</button>
  <button class="icon-btn" id="btn-reset" title="Übersicht">⌂</button>
</header>

<section class="sheet" id="sheet" data-state="peek" aria-label="Tourenauswahl">
  <div class="grip-zone" id="grip"><div class="grip"></div></div>
  <div class="sheet-head">
    <div class="sheet-title" id="sheet-title">Rundwege am Blindsee</div>
    <div class="sheet-sub" id="sheet-sub">Alle Touren sind Runden — Start = Ziel</div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="routes" aria-selected="true">Runden</button>
    <button class="tab" role="tab" data-tab="detail" aria-selected="false">Details</button>
    <button class="tab" role="tab" data-tab="edit" aria-selected="false">Anpassen</button>
    <button class="tab" role="tab" data-tab="spots" aria-selected="false">Orte</button>
  </nav>
  <div class="panel" data-active id="panel-routes">
    <div class="filters" id="filters"></div>
    <div id="route-list"></div>
  </div>
  <div class="panel" id="panel-detail"></div>
  <div class="panel" id="panel-edit"></div>
  <div class="panel" id="panel-spots"></div>
</section>

<div class="overlay" id="wizard" hidden>
  <div class="wiz">
    <div class="wiz-head">
      <div class="wiz-step-no" id="wiz-no">Schritt 1 von 4</div>
      <h2 class="wiz-q" id="wiz-q"></h2>
      <p class="wiz-hint" id="wiz-hint"></p>
      <button class="wiz-x" id="wiz-close">×</button>
    </div>
    <div class="bar"><i id="wiz-bar" style="width:25%"></i></div>
    <div class="wiz-body" id="wiz-body"></div>
    <div class="wiz-foot">
      <button class="btn btn-ghost" id="wiz-back">Zurück</button>
      <button class="btn btn-main" id="wiz-next">Weiter</button>
    </div>
  </div>
</div>

<div class="ground" id="ground" hidden>
  <div class="g-top">
    <div class="g-chip">
      <div class="g-name" id="g-name"></div>
      <div class="g-dir" id="g-dir"></div>
    </div>
    <div class="g-spacer"></div>
    <button class="icon-btn" id="g-info" title="Infos">i</button>
    <button class="icon-btn" id="g-exit" title="Zurück zur Karte">✕</button>
  </div>
  <div class="g-bottom">
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;align-items:stretch">
      <button class="cta" id="g-photo-btn" hidden style="align-self:flex-start">Foto vor Ort</button>
      <div class="t-bar">
        <button class="t-play" id="t-play" title="Abfahren">▶</button>
        <input type="range" id="t-slider" class="t-slider" min="0" max="1000" value="0"
               aria-label="Position auf der Runde">
      </div>
    </div>
    <button class="compass" id="g-compass" title="Nach Norden"><span class="compass-n" id="g-needle">N</span></button>
  </div>
</div>

<div class="photo-view" id="photo-view" hidden>
  <img id="photo-img" alt="Foto vom Ort">
  <div class="photo-bar">
    <span>Echtes Foto vor Ort · © Panoramax-Mitwirkende (CC-BY-SA)</span>
    <button class="icon-btn" id="photo-close" title="Zurück zur 3D-Ansicht">✕</button>
  </div>
</div>

<div class="loading" id="loading" hidden><div><div class="spin"></div><span id="loading-txt">Gelände wird geladen…</span></div></div>

<script>
const DATA = __DATA__;
const ROUTES = DATA.routes, SPOTS = DATA.hotspots, LAKE = DATA.lake;
const SPOT_BY_ID = Object.fromEntries(SPOTS.map(s => [s.id, s]));
const CAT_ICON = {beach:"🏖", nature:"🌲", photo:"📷", map:"🧭", "360":"🔭"};
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============================ Karte ============================ */
const map = new maplibregl.Map({
  container:"map", attributionControl:true, maxPitch:85, hash:false,
  center:LAKE.center, zoom:14.2, pitch:48, bearing:-18, maxZoom:20.5,
  style:{
    version:8,
    glyphs:"https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf",
    sources:{
      sat:{type:"raster", tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
        tileSize:256, maxzoom:19,
        attribution:"Luftbild © Esri, Maxar, Earthstar Geographics · Wege © OpenStreetMap-Mitwirkende · Höhen © Mapzen/AWS · Höhenlinien via maplibre-contour (BSD-3)"},
      dem:{type:"raster-dem", tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
        tileSize:256, maxzoom:15, encoding:"terrarium"}
    },
    layers:[
      {id:"bg", type:"background", paint:{"background-color":"#0d1117"}},
      {id:"sat", type:"raster", source:"sat"}
    ],
    terrain:{source:"dem", exaggeration:1.0}
  }
});
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), "bottom-left");
map.touchZoomRotate.enableRotation();

let activeRoute = null, activeBase = null, activeSpot = null;

/* ---- Anpassungen je Runde: Variante, Startpunkt, Abstecher ---- */
const custom = loadJSON("blindsee-custom", {});
const myPoints = loadJSON("blindsee-points", []);
const MY_KINDS = [
  {k:"wc",      t:"WC",         i:"🚻"},
  {k:"diaper",  t:"Wickelraum", i:"🍼"},
  {k:"parking", t:"Parkplatz",  i:"🅿️"},
  {k:"bench",   t:"Bank",       i:"🪑"},
  {k:"other",   t:"Sonstiges",  i:"📌"},
];

function loadJSON(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
/* Varianten werden erst beim Oeffnen von "Anpassen" geholt. */
let VARIANTS = null, variantsLoading = null;
function loadVariants(){
  if (VARIANTS) return Promise.resolve(VARIANTS);
  if (variantsLoading) return variantsLoading;
  variantsLoading = fetch("variants.json")
    .then(r => r.ok ? r.json() : {})
    .catch(() => ({}))
    .then(v => { VARIANTS = v || {}; return VARIANTS; });
  return variantsLoading;
}
function variantsOf(id){ return (VARIANTS && VARIANTS[id]) || []; }

function customFor(id){
  if (!custom[id]) custom[id] = {variant:0, startDist:0, spurs:{}};
  return custom[id];
}

/* ---- Filterzustand ---- */
const filters = {len:"all", wagen:"all", props:[]};

/* Kinderwagen-Modus: blendet Rastpunkte ein, vergroessert die Bedienflaechen
   und stellt ueberall die Kinderwagen-Ampel in den Vordergrund. */
let kwMode = false;
try { kwMode = localStorage.getItem("blindsee-kw") === "1"; } catch(e){}

const AMPEL_TEXT = {green:"Kinderwagen: problemlos", yellow:"Kinderwagen: machbar",
                    red:"Kinderwagen: schwierig"};
const REST_ICON = {bench:"🪑", waste:"🗑", wc:"🚻", water:"🚰", shelter:"⛺",
                   parking:"🅿️", food:"🍽", picnic:"🧺", view:"🔭"};

map.on("load", () => {
  // Himmel + Dunst: erst dadurch entsteht in der Bodenansicht ein echter
  // Horizont statt einer abgeschnittenen Gelaendekante.
  if (map.setSky) map.setSky({
    "sky-color":"#7fb2e5", "horizon-color":"#dbe8f4", "fog-color":"#c4d6e6",
    "sky-horizon-blend":.65, "horizon-fog-blend":.55, "fog-ground-blend":.3
  });
  map.addSource("route", {type:"geojson", data:emptyFC(), lineMetrics:true});
  map.addLayer({id:"route-glow", type:"line", source:"route",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#4aa8ff","line-width":11,"line-opacity":.22,"line-blur":5}});
  map.addLayer({id:"route-line", type:"line", source:"route",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#4aa8ff","line-width":4}});
  map.addLayer({id:"route-dash", type:"line", source:"route",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#eaf4ff","line-width":1.6,"line-dasharray":[1.5,2.5],"line-opacity":.75}});

  map.addSource("profpos", {type:"geojson", data:emptyFC()});

  map.addSource("spur", {type:"geojson", data:emptyFC()});
  map.addLayer({id:"spur-line", type:"line", source:"spur",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-color":"#d29922","line-width":3.5,"line-dasharray":[2,1.6]}});

  map.addSource("shade", {type:"geojson", data:emptyFC()});
  map.addLayer({id:"shade-line", type:"line", source:"shade",
    layout:{"line-cap":"round","line-join":"round"},
    paint:{"line-width":9, "line-opacity":.55, "line-blur":1,
           "line-color":["match", ["get","sh"], 1, "#2f6b8f", "#f2c14e"]}});

  map.addSource("rest", {type:"geojson", data:emptyFC()});
  map.addLayer({id:"rest-halo", type:"circle", source:"rest",
    paint:{"circle-radius":11,"circle-color":"#3fb950","circle-opacity":.18}});
  map.addLayer({id:"rest-dot", type:"circle", source:"rest",
    paint:{"circle-radius":5,"circle-color":"#3fb950","circle-stroke-width":1.5,
           "circle-stroke-color":"#0d1117"}});

  document.getElementById("btn-kw").setAttribute("aria-pressed", String(kwMode));
  document.body.classList.toggle("kw", kwMode);
  makeArrowIcon();
  map.addLayer({id:"route-arrows", type:"symbol", source:"route",
    layout:{"symbol-placement":"line", "symbol-spacing":70, "icon-image":"dir-arrow",
            "icon-size":0.5, "icon-rotation-alignment":"map", "icon-allow-overlap":true,
            "visibility":"none"},
    paint:{"icon-opacity":0.95}});

  map.addLayer({id:"profpos-dot", type:"circle", source:"profpos",
    paint:{"circle-radius":8,"circle-color":"#ffffff","circle-stroke-width":3,
           "circle-stroke-color":"#f0883e"}});

  map.addSource("tourpos", {type:"geojson", data:emptyFC()});
  map.addLayer({id:"tour-puck-halo", type:"circle", source:"tourpos",
    paint:{"circle-radius":16,"circle-color":"#ffffff","circle-opacity":.22}});
  map.addLayer({id:"tour-puck", type:"circle", source:"tourpos",
    paint:{"circle-radius":7,"circle-color":"#ffffff","circle-stroke-width":3,
           "circle-stroke-color":"#4aa8ff"}});

  renderRoutes(); renderSpots(); addSpotMarkers();
  selectRoute(ROUTES.find(r => r.id === "see") || ROUTES[0], {fly:true});
});

function emptyFC(){ return {type:"FeatureCollection", features:[]}; }

/* Richtungspfeil als Canvas-Bild - so braucht die Karte keine externe Grafik. */
function makeArrowIcon(){
  const n = 48, c = document.createElement("canvas");
  c.width = c.height = n;
  const g = c.getContext("2d");
  g.translate(n / 2, n / 2);
  g.beginPath();
  g.moveTo(0, -15); g.lineTo(11, 11); g.lineTo(0, 4); g.lineTo(-11, 11);
  g.closePath();
  g.fillStyle = "#ffffff";
  g.strokeStyle = "rgba(10,20,30,.85)";
  g.lineWidth = 2.5;
  g.stroke(); g.fill();
  const img = g.getImageData(0, 0, n, n);
  if (!map.hasImage("dir-arrow"))
    map.addImage("dir-arrow", {width:n, height:n, data:img.data});
}

/* ============================ Marker ============================ */
function addSpotMarkers(){
  SPOTS.forEach(s => {
    const el = document.createElement("button");
    el.style.cssText = "width:30px;height:30px;border-radius:99px;background:rgba(22,27,34,.94);"+
      "border:2px solid #4aa8ff;display:grid;place-items:center;font-size:14px;cursor:pointer;"+
      "box-shadow:0 3px 10px rgba(0,0,0,.5)";
    el.textContent = CAT_ICON[s.category] || "📍";
    el.setAttribute("aria-label", s.name);
    el.addEventListener("click", ev => { ev.stopPropagation(); openSpot(s); });
    new maplibregl.Marker({element:el, anchor:"center"}).setLngLat([s.lon, s.lat]).addTo(map);
    s._el = el;
  });
}

function renderRest(r){
  const src = map.getSource("rest");
  if (!src) return;
  if (!kwMode || !r){ src.setData(emptyFC()); return; }
  src.setData({type:"FeatureCollection", features:(r.rest_points || []).map(p => ({
    type:"Feature", geometry:{type:"Point", coordinates:[p.lon, p.lat]},
    properties:{kind:p.kind}
  }))});
}

function highlightSpots(ids){
  const set = new Set(ids || []);
  SPOTS.forEach(s => {
    if (!s._el) return;
    const on = set.size === 0 || set.has(s.id);
    s._el.style.opacity = on ? "1" : ".32";
    s._el.style.borderColor = set.has(s.id) ? "#4aa8ff" : "#2b333d";
  });
}

/* ============================ Runden ============================ */
function routePills(r){
  const p = [];
  if (kwMode) p.push(`<span class="ampel ${r.stroller_grade}">${AMPEL_TEXT[r.stroller_grade]}</span>`);
  p.push(`<span class="pill">${r.ascent_m} Hm</span>`);
  p.push(`<span class="pill">${r.duration}</span>`);
  p.push(`<span class="pill ${r.difficulty === "Leicht" ? "ok" : r.difficulty === "Sportlich" ? "warn" : ""}">${r.difficulty}</span>`);
  if (!kwMode && r.stroller_ok) p.push(`<span class="pill ok">Kinderwagen</span>`);
  if (kwMode && r.benches) p.push(`<span class="pill ok">${r.benches} Bänke</span>`);
  if (r.lake_share >= .5) p.push(`<span class="pill hot">${Math.round(r.lake_share*100)} % am Wasser</span>`);
  if (r.shade_share >= .35) p.push(`<span class="pill ok">${Math.round(r.shade_share*100)} % Schatten</span>`);
  if (r.hotspots.length) p.push(`<span class="pill">${r.hotspots.length} Orte</span>`);
  return p.join("");
}

function renderRoutes(list, reasons){
  // mit den Anpassungen anzeigen, sonst widerspricht die Liste der Kopfzeile
  const rs = (list || ROUTES).map(deriveRoute);
  const el = document.getElementById("route-list");
  if (!rs.length){ el.innerHTML = `<div class="empty">Keine Runde passt zu dieser Auswahl.</div>`; return; }
  el.innerHTML = rs.map((r, i) => `
    <div class="card ${activeRoute && r.id === activeRoute.id ? "selected" : ""}" data-route="${r.id}">
      <div class="card-top">
        <span class="card-name">${reasons && i === 0 ? "★ " : ""}${r.name}${
          r.variantIdx ? ` · Variante ${r.variantIdx}` : ""}${
          (r.activeSpurs && r.activeSpurs.length) ? " · mit Abstecher" : ""}</span>
        <span class="card-km">${r.km.toFixed(2).replace(".", ",")} km</span>
      </div>
      <div class="card-meta">${routePills(r)}</div>
      <div class="card-desc">${kwMode && r.desc_kw ? r.desc_kw : r.desc}</div>
      ${kwMode && r.stroller_notes.length
        ? `<div class="kw-note">${r.stroller_notes.join(" · ")}</div>` : ""}
      ${reasons && reasons[r.id] ? `<div class="why">${reasons[r.id]}</div>` : ""}
    </div>`).join("");
  el.querySelectorAll("[data-route]").forEach(c =>
    c.addEventListener("click", () => selectRoute(ROUTES.find(r => r.id === c.dataset.route), {fly:true})));
  renderFilters();
}

function selectRoute(base, opt){
  if (!base) return;
  activeBase = base;
  const r = deriveRoute(base);
  activeRoute = r;
  const src = map.getSource("route");
  if (src) src.setData({type:"Feature", geometry:{type:"LineString", coordinates:r.coords}, properties:{}});
  highlightSpots(r.hotspots);
  renderRest(r);
  paintShade(r);
  const spurSrc = map.getSource("spur");
  if (spurSrc) spurSrc.setData({type:"FeatureCollection",
    features:(r.activeSpurs || []).map(sp => ({
      type:"Feature", geometry:{type:"LineString", coordinates:sp.coords},
      properties:{}}))});
  renderMyMarkers();
  document.getElementById("sheet-title").textContent = r.name;
  document.getElementById("sheet-sub").textContent =
    `${r.km.toFixed(2).replace(".", ",")} km Runde · ${r.ascent_m} Hm · ${r.duration}`;
  // nur die Markierung umsetzen statt die ganze Liste neu zu erzeugen
  const cards = document.querySelectorAll("#route-list [data-route]");
  if (cards.length) cards.forEach(c => c.classList.toggle("selected", c.dataset.route === r.id));
  else renderRoutes();
  renderDetail(r);
  if (opt && opt.fly){
    const b = new maplibregl.LngLatBounds();
    r.coords.forEach(c => b.extend(c));
    map.fitBounds(b, {padding:{top:90, bottom:window.innerHeight*0.42, left:50, right:50},
      pitch:46, bearing:-18, duration:reduceMotion ? 0 : 1300});
  }
}

/* ============================ Filter ============================ */
const LEN_FILTERS = [
  {v:"all",   t:"Alle"},
  {v:"short", t:"bis 2 km",  test:r => r.km <= 2},
  {v:"mid",   t:"2–4 km",    test:r => r.km > 2 && r.km <= 4},
  {v:"long",  t:"über 4 km", test:r => r.km > 4},
];
const WAGEN_FILTERS = [
  {v:"all",    t:"Egal"},
  {v:"green",  t:"nur problemlos", test:r => r.stroller_grade === "green"},
  {v:"ok",     t:"auch machbar",   test:r => r.stroller_grade !== "red"},
];
const PROP_FILTERS = [
  {v:"water", t:"am Wasser",   test:r => r.lake_share >= .5},
  {v:"shade", t:"Schatten",    test:r => r.shade_share >= .3},
  {v:"bench", t:"viele Bänke", test:r => r.benches >= 3},
  {v:"spots", t:"viel zu sehen", test:r => r.hotspots.length >= 3},
  {v:"flat",  t:"flach",       test:r => r.steep_share < .06},
];

function passesFilters(r){
  const lf = LEN_FILTERS.find(f => f.v === filters.len);
  if (lf && lf.test && !lf.test(r)) return false;
  const wf = WAGEN_FILTERS.find(f => f.v === filters.wagen);
  if (wf && wf.test && !wf.test(r)) return false;
  for (const p of filters.props){
    const pf = PROP_FILTERS.find(f => f.v === p);
    if (pf && !pf.test(r)) return false;
  }
  return true;
}

function renderFilters(){
  const el = document.getElementById("filters");
  if (!el) return;
  const hits = ROUTES.map(deriveRoute).filter(passesFilters).length;
  el.innerHTML = `
    <div class="flabel">Länge</div>
    <div class="frow">${LEN_FILTERS.map(f =>
      `<button class="chip ${filters.len === f.v ? "on" : ""}" data-len="${f.v}">${f.t}</button>`).join("")}</div>
    <div class="flabel">Kinderwagen</div>
    <div class="frow">${WAGEN_FILTERS.map(f =>
      `<button class="chip ${filters.wagen === f.v ? "on" : ""}" data-wagen="${f.v}">${f.t}</button>`).join("")}</div>
    <div class="flabel">Eigenschaften</div>
    <div class="frow">${PROP_FILTERS.map(f =>
      `<button class="chip ${filters.props.includes(f.v) ? "on" : ""}" data-prop="${f.v}">${f.t}</button>`).join("")}</div>
    <div class="fcount">${hits} von ${ROUTES.length} Runden passen${
      hits === 0 ? " — Filter zu eng" : ""}</div>`;
  el.querySelectorAll("[data-len]").forEach(b => b.addEventListener("click", () => {
    filters.len = b.dataset.len; applyFilters();
  }));
  el.querySelectorAll("[data-wagen]").forEach(b => b.addEventListener("click", () => {
    filters.wagen = b.dataset.wagen; applyFilters();
  }));
  el.querySelectorAll("[data-prop]").forEach(b => b.addEventListener("click", () => {
    const v = b.dataset.prop;
    filters.props = filters.props.includes(v)
      ? filters.props.filter(x => x !== v) : filters.props.concat(v);
    applyFilters();
  }));
}

function applyFilters(){
  const list = ROUTES.filter(r => passesFilters(deriveRoute(r)));
  renderRoutes(list.length ? list : []);
  if (list.length && (!activeBase || !list.includes(activeBase)))
    selectRoute(list[0], {fly:true});
}

/* ==================== Abgeleitete Runde ==================== */
/* Variante, Startpunkt und Abstecher werden nicht in die Grunddaten
   geschrieben, sondern bei jeder Anzeige daraufgelegt - so bleibt die
   berechnete Runde unveraendert und alles ist jederzeit ruecksetzbar. */
function lineLength(coords){
  let d = 0;
  for (let i = 1; i < coords.length; i++){
    const a = coords[i - 1], b = coords[i];
    d += Math.hypot((b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180),
                    (b[1] - a[1]) * 110540);
  }
  return d;
}

function rotateCoords(coords, startM){
  const total = lineLength(coords);
  if (!startM || startM <= 0 || startM >= total) return coords.slice();
  let acc = 0, idx = 1, t = 0;
  for (let i = 1; i < coords.length; i++){
    const a = coords[i - 1], b = coords[i];
    const seg = Math.hypot((b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180),
                           (b[1] - a[1]) * 110540);
    if (acc + seg >= startM){ idx = i; t = seg ? (startM - acc) / seg : 0; break; }
    acc += seg;
  }
  const a = coords[idx - 1], b = coords[idx];
  const cut = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  return [cut].concat(coords.slice(idx, coords.length - 1))
              .concat(coords.slice(0, idx)).concat([cut]);
}

function shiftKm(v, startKm, totalKm){
  const x = (v - startKm) % totalKm;
  return Math.round((x < 0 ? x + totalKm : x) * 100) / 100;
}

function deriveRoute(base){
  const c = customFor(base.id);
  const vs = variantsOf(base.id);
  const variant = c.variant > 0 && vs[c.variant - 1] ? vs[c.variant - 1] : null;
  const r = Object.assign({}, base, variant || {});
  r.id = base.id; r.name = base.name;
  r.desc = base.desc; r.desc_kw = base.desc_kw;
  r.variants = vs; r.spurs = base.spurs || [];
  // Schattenprofil ist nur fuer die Standardfuehrung gerechnet
  r.shade = variant ? null : base.shade;
  r.variantIdx = c.variant;

  const startM = c.startDist || 0;
  r.startDist = startM;
  if (startM > 0){
    const totalKm = r.km;
    const startKm = startM / 1000;
    r.coords = rotateCoords(r.coords, startM);
    r.steep_sections = (r.steep_sections || []).map(x =>
      Object.assign({}, x, {at_km: shiftKm(x.at_km, startKm, totalKm)}))
      .sort((a, b) => a.at_km - b.at_km);
    r.steps_at = (r.steps_at || []).map(x =>
      Object.assign({}, x, {at_km: shiftKm(x.at_km, startKm, totalKm)}))
      .sort((a, b) => a.at_km - b.at_km);
    r.rest_points = (r.rest_points || []).map(x =>
      Object.assign({}, x, {at_km: shiftKm(x.at_km, startKm, totalKm)}))
      .sort((a, b) => a.at_km - b.at_km);
    r.spurs = r.spurs.map(x =>
      Object.assign({}, x, {at_km: shiftKm(x.at_km, startKm, totalKm)}))
      .sort((a, b) => a.at_km - b.at_km);
    r.shadeShift = startM;
  }

  const on = r.spurs.filter(x => c.spurs[spurKey(x)]);
  r.activeSpurs = on;
  if (on.length){
    const extra = on.reduce((s, x) => s + x.detour_m, 0);
    r.km = Math.round((r.km + extra / 1000) * 100) / 100;
    r.minutes = r.minutes + Math.round(extra / 4000 * 60);
    r.duration = r.minutes >= 60
      ? `${Math.floor(r.minutes / 60)}h ${String(r.minutes % 60).padStart(2, "0")}m`
      : `${r.minutes} Min`;
  }
  return r;
}

function spurKey(sp){ return `${sp.kind}:${sp.lat},${sp.lon}`; }

/* ============================ Details ============================ */
function refreshActive(opt){
  if (!activeBase) return;
  saveJSON("blindsee-custom", custom);
  selectRoute(activeBase, opt || {});
  renderFilters();
}

function renderDetail(r){
  const el = document.getElementById("panel-detail");
  if (!r){ el.innerHTML = `<div class="empty">Wähle eine Runde.</div>`; return; }
  const spots = r.hotspots.map(id => SPOT_BY_ID[id]).filter(Boolean);
  el.innerHTML = `
    <div class="stat-grid">
      <div class="stat"><div class="stat-v">${r.km.toFixed(1).replace(".", ",")}</div><div class="stat-l">km</div></div>
      <div class="stat"><div class="stat-v">${r.ascent_m}</div><div class="stat-l">Höhenm.</div></div>
      <div class="stat"><div class="stat-v">${r.minutes}</div><div class="stat-l">Minuten</div></div>
      <div class="stat"><div class="stat-v">${r.max_slope_pct.toFixed(0)}%</div><div class="stat-l">max. Steig.</div></div>
    </div>
    <div class="section-h">Höhenprofil</div>

/* Was auf der Runde mit dem Wagen wirklich auf einen zukommt - der Reihe nach,
   damit man weiss wann getragen wird und wo eine Bank zum Pausieren steht. */
function kwSection(r){
  const items = [];
  (r.steps_at || []).forEach(x => items.push({at:x.at_km, cls:"bad",
    txt:`<b>Treppen (${x.length_m} m)</b> — Wagen tragen`}));
  (r.steep_sections || []).forEach(x => items.push({at:x.at_km, cls:"warn",
    txt:`<b>Steigung bis ${String(x.slope_pct).replace(".", ",")} %</b> über ${x.length_m} m — schieben`}));

  // Baenke die dicht beieinanderstehen als einen Rastplatz zusammenfassen
  const benches = (r.rest_points || []).filter(p => p.kind === "bench");
  let group = [];
  const flush = () => {
    if (!group.length) return;
    const n = group.length;
    items.push({at:group[0].at_km, cls:"good",
      txt:n > 1 ? `<b>Rastplatz</b> — ${n} Bänke beieinander` : `<b>Bank</b> zum Pausieren`});
    group = [];
  };
  benches.forEach(b => {
    if (group.length && b.at_km - group[group.length - 1].at_km > 0.15) flush();
    group.push(b);
  });
  flush();

  (r.rest_points || []).filter(p => p.kind !== "bench" && p.kind !== "waste")
    .forEach(p => items.push({at:p.at_km, cls:"", txt:`<b>${p.label}</b>`}));

  items.sort((a, b) => a.at - b.at);
  const km = v => String(v.toFixed(1)).replace(".", ",");
  const wc = (r.rest_points || []).some(p => p.kind === "wc");

  return `<div class="section-h">Mit Kinderwagen</div>
    <span class="ampel ${r.stroller_grade}">${AMPEL_TEXT[r.stroller_grade]}</span>
    <div class="kw-note">${r.stroller_notes.join(" · ")}</div>
    ${!wc ? `<div class="kw-note">Kein WC direkt an der Strecke verzeichnet —
      am besten vorher am Parkplatz einplanen.</div>` : ""}
    ${items.length ? `<div class="tl">${items.map(i =>
      `<div class="tl-item ${i.cls}"><span class="tl-km">km ${km(i.at)}</span>${i.txt}</div>`
    ).join("")}</div>` : `<div class="kw-note">Keine besonderen Stellen verzeichnet.</div>`}`;
}

/* Hoehenprofil: nach Steigung eingefaerbt und mit der Karte gekoppelt -
   beim Fahren ueber das Profil wandert eine Marke auf der Strecke mit.
   Dieses Zusammenspiel haben gaengige Tourenplaner, es macht ein Profil
   erst lesbar: man sieht, WO der Anstieg liegt. */
const GRADE_COLORS = [
  [4,  "#4aa8ff"],   // flach
  [8,  "#3fb950"],   // sanft
  [12, "#d29922"],   // spuerbar
  [18, "#f0883e"],   // steil
  [99, "#f85149"],   // sehr steil
];
function gradeColor(pct){
  for (const [lim, col] of GRADE_COLORS) if (pct < lim) return col;
  return "#f85149";
}

function drawProfile(r){
  const svg = document.getElementById("prof");
  if (!svg || !r.profile || r.profile.length < 2) return;
  const zs = r.profile;
  const lo = Math.min(...zs), hi = Math.max(...zs), span = Math.max(1, hi - lo);
  const W = 300, H = 58, segM = (r.km * 1000) / (zs.length - 1);
  const X = i => i / (zs.length - 1) * W;
  const Y = z => H - 4 - (z - lo) / span * 44;

  let parts = "";
  for (let i = 1; i < zs.length; i++){
    const g = Math.abs(zs[i] - zs[i - 1]) / Math.max(1, segM) * 100;
    parts += `<line x1="${X(i-1).toFixed(1)}" y1="${Y(zs[i-1]).toFixed(1)}" `
          +  `x2="${X(i).toFixed(1)}" y2="${Y(zs[i]).toFixed(1)}" `
          +  `stroke="${gradeColor(g)}" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  const area = zs.map((z, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(z).toFixed(1)).join(" ");
  svg.innerHTML =
    `<path d="${area} L${W} ${H} L0 ${H} Z" fill="rgba(74,168,255,.12)"/>` + parts +
    `<line id="prof-cursor" x1="0" y1="0" x2="0" y2="${H}" stroke="#fff" stroke-width="1" opacity="0"/>`;

  const readout = document.getElementById("prof-readout");
  const move = ev => {
    const rect = svg.getBoundingClientRect();
    const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - rect.left;
    const frac = Math.max(0, Math.min(1, cx / rect.width));
    const i = Math.round(frac * (zs.length - 1));
    const cur = svg.querySelector("#prof-cursor");
    if (cur){ cur.setAttribute("x1", X(i)); cur.setAttribute("x2", X(i)); cur.setAttribute("opacity", "0.9"); }
    const g = i > 0 ? Math.abs(zs[i] - zs[i - 1]) / Math.max(1, segM) * 100 : 0;
    if (readout) readout.innerHTML =
      `<b>km ${(frac * r.km).toFixed(2).replace(".", ",")}</b> · ${Math.round(zs[i])} m ü. NN · ` +
      `<span style="color:${gradeColor(g)}">${g.toFixed(0)} % Steigung</span>`;
    const src = map.getSource("profpos");
    const c = pointAtOn(r, frac * lineLength(r.coords));
    if (src && c) src.setData({type:"Feature", geometry:{type:"Point", coordinates:c}, properties:{}});
    if (ev.cancelable) ev.preventDefault();
  };
  const leave = () => {
    const cur = svg.querySelector("#prof-cursor");
    if (cur) cur.setAttribute("opacity", "0");
    const src = map.getSource("profpos");
    if (src) src.setData(emptyFC());
    if (readout) readout.innerHTML = profLegend();
  };
  svg.onmousemove = move; svg.onmouseleave = leave;
  svg.ontouchstart = move; svg.ontouchmove = move; svg.ontouchend = leave;
  if (readout) readout.innerHTML = profLegend();
}

function profLegend(){
  return `<span style="color:var(--faint)">Über das Profil fahren zeigt die Stelle auf der Karte</span>`;
}

/* ====================== Hoehenlinien ======================
   maplibre-contour (BSD-3-Clause, onthegomap) rechnet Hoehenlinien direkt im
   Browser aus denselben Terrain-Kacheln, die die Karte ohnehin laedt - also
   ohne zusaetzliche Datenquelle. Wird erst beim Einschalten nachgeladen. */
const DEM_TILES = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
let contourReady = false, contourOn = false, contourLoading = null;

function loadScript(src){
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = src; el.onload = res; el.onerror = rej;
    document.head.appendChild(el);
  });
}

async function setupContours(){
  if (contourReady) return true;
  if (contourLoading) return contourLoading;
  contourLoading = (async () => {
    await loadScript("https://cdn.jsdelivr.net/npm/maplibre-contour@0.1.0/dist/index.min.js");
    const dem = new mlcontour.DemSource({
      url: DEM_TILES, encoding: "terrarium", maxzoom: 15, worker: true,
    });
    dem.setupMaplibre(maplibregl);
    map.addSource("contours", {
      type: "vector", maxzoom: 15,
      tiles: [dem.contourProtocolUrl({
        thresholds: {11:[100, 500], 12:[50, 250], 13:[25, 100], 14:[10, 50], 15:[10, 50]},
        contourLayer: "contours", elevationKey: "ele", levelKey: "level",
        extent: 4096, buffer: 1,
      })],
    });
    map.addLayer({id:"contour-line", type:"line", source:"contours",
      "source-layer":"contours",
      paint:{"line-color":"rgba(255,255,255,.5)",
             "line-width":["match", ["get","level"], 1, 1.2, 0.6]}}, "route-glow");
    map.addLayer({id:"contour-label", type:"symbol", source:"contours",
      "source-layer":"contours", filter:[">", ["get","level"], 0],
      layout:{"symbol-placement":"line", "text-size":10,
              "text-font":["Noto Sans Regular"],
              "text-field":["concat", ["to-string", ["get","ele"]], " m"]},
      paint:{"text-color":"#ffffff", "text-halo-color":"rgba(0,0,0,.65)",
             "text-halo-width":1.2}}, "route-glow");
    contourReady = true;
    return true;
  })().catch(() => { contourLoading = null; return false; });
  return contourLoading;
}

async function toggleContours(){
  const btn = document.getElementById("btn-contour");
  if (!contourReady){
    btn.textContent = "…";
    const ok = await setupContours();
    btn.textContent = "⛰";
    if (!ok){ btn.title = "Höhenlinien konnten nicht geladen werden"; return; }
    contourOn = true;
  } else {
    contourOn = !contourOn;
    ["contour-line", "contour-label"].forEach(id => {
      if (map.getLayer(id))
        map.setLayoutProperty(id, "visibility", contourOn ? "visible" : "none");
    });
  }
  btn.setAttribute("aria-pressed", String(contourOn));
  try { localStorage.setItem("blindsee-contour", contourOn ? "1" : "0"); } catch(e){}
}

document.getElementById("btn-contour").addEventListener("click", toggleContours);

/* ====================== GPX-Export ======================
   Jeder ausgereifte Tourenplaner kann das, und ohne Export ist die Runde
   hier gefangen - mit GPX laeuft sie in Komoot, OsmAnd, Garmin oder OruxMaps.
   Selbst geschrieben; GPX 1.1 ist ein schlankes, offenes Format. */
function elevAlong(r, frac){
  const prof = r.profile;
  if (!prof || !prof.length) return null;
  const x = Math.max(0, Math.min(1, frac)) * (prof.length - 1);
  const i = Math.floor(x), t = x - i;
  return prof[i] + (prof[Math.min(prof.length - 1, i + 1)] - prof[i]) * t;
}

function routeGPX(r){
  const esc = t => String(t).replace(/[<>&'"]/g, c =>
    ({"<":"&lt;", ">":"&gt;", "&":"&amp;", "'":"&apos;", '"':"&quot;"}[c]));
  const total = lineLength(r.coords) || 1;
  let acc = 0;
  const pts = r.coords.map((c, i) => {
    if (i > 0){
      const a = r.coords[i - 1];
      acc += Math.hypot((c[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180),
                        (c[1] - a[1]) * 110540);
    }
    const ele = elevAlong(r, acc / total);
    return `   <trkpt lat="${c[1].toFixed(6)}" lon="${c[0].toFixed(6)}">` +
           (ele === null ? "" : `<ele>${ele.toFixed(1)}</ele>`) + `</trkpt>`;
  }).join("\n");

  const wpts = [];
  (r.hotspots || []).forEach(id => {
    const sp = SPOT_BY_ID[id];
    if (sp) wpts.push(`  <wpt lat="${sp.lat}" lon="${sp.lon}">
    <name>${esc(sp.name)}</name><sym>Flag</sym></wpt>`);
  });
  (r.rest_points || []).forEach(p => wpts.push(
    `  <wpt lat="${p.lat}" lon="${p.lon}">
    <name>${esc(p.name)} (km ${p.at_km.toFixed(2).replace(".", ",")})</name><sym>Picnic Area</sym></wpt>`));
  (r.steps_at || []).forEach(x => {
    const c = pointAtOn(r, x.at_km * 1000);
    if (c) wpts.push(`  <wpt lat="${c[1].toFixed(6)}" lon="${c[0].toFixed(6)}">
    <name>Treppen ${x.length_m} m — Wagen tragen</name><sym>Danger Area</sym></wpt>`);
  });
  myPoints.forEach(mp => wpts.push(`  <wpt lat="${mp.lat}" lon="${mp.lon}">
    <name>${esc(mp.name)}</name><sym>Flag</sym></wpt>`));

  return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Blindsee Tourenkarte"
     xmlns="http://www.topografix.com/GPX/1/1">
 <metadata>
  <name>${esc(r.name)}</name>
  <desc>${esc(`${r.km.toFixed(2).replace(".", ",")} km Rundweg, ${r.ascent_m} Hm, ${r.duration}. Wege und Orte aus OpenStreetMap (ODbL).`)}</desc>
 </metadata>
${wpts.join("\n")}
 <trk>
  <name>${esc(r.name)}</name>
  <trkseg>
${pts}
  </trkseg>
 </trk>
</gpx>`;
}

function pointAtOn(r, distM){
  let acc = 0;
  for (let i = 1; i < r.coords.length; i++){
    const a = r.coords[i - 1], b = r.coords[i];
    const seg = Math.hypot((b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180),
                           (b[1] - a[1]) * 110540);
    if (acc + seg >= distM){
      const t = seg ? (distM - acc) / seg : 0;
      return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
    }
    acc += seg;
  }
  return r.coords[r.coords.length - 1];
}

function downloadGPX(r){
  const blob = new Blob([routeGPX(r)], {type:"application/gpx+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = r.name.replace(/[^\wäöüÄÖÜß-]+/g, "_") + ".gpx";
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ============================ Anpassen ============================ */
function startCandidates(r){
  const out = [];
  out.push({at_km:0, label:"Ursprung", name:"Wie berechnet", icon:"🏁", dist:0});
  (r.rest_points || []).filter(p => p.kind === "parking" || p.kind === "bench")
    .forEach(p => out.push({at_km:p.at_km, label:p.label, name:p.name,
                            icon:REST_ICON[p.kind] || "📍"}));
  (r.hotspots || []).forEach(id => {
    const sp = SPOT_BY_ID[id];
    if (!sp) return;
    const at = nearestKmOnRoute(r, sp.lat, sp.lon);
    if (at === null) return;
    out.push({at_km:at, label:"Ort", name:sp.name, icon:CAT_ICON[sp.category] || "📍"});
  });
  myPoints.forEach(mp => {
    const at = nearestKmOnRoute(r, mp.lat, mp.lon);
    if (at !== null) out.push({at_km:at, label:"Eigener Punkt", name:mp.name,
                               icon:(MY_KINDS.find(k => k.k === mp.kind) || {}).i || "📌"});
  });
  const seen = new Set();
  return out.filter(o => {
    const k = o.at_km.toFixed(2);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  }).sort((a, b) => a.at_km - b.at_km);
}

function nearestKmOnRoute(r, lat, lon){
  let acc = 0, bd = Infinity, bat = 0;
  for (let i = 1; i < r.coords.length; i++){
    const a = r.coords[i - 1], b = r.coords[i];
    const seg = Math.hypot((b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180),
                           (b[1] - a[1]) * 110540);
    const d = Math.hypot((a[0] - lon) * 111320 * Math.cos(lat * Math.PI / 180),
                         (a[1] - lat) * 110540);
    if (d < bd){ bd = d; bat = acc; }
    acc += seg;
  }
  return bd > 250 ? null : Math.round(bat / 10) / 100;
}

function renderEdit(r){
  const el = document.getElementById("panel-edit");
  if (!el || !r) return;
  if (!VARIANTS && r.variant_count > 0){
    el.innerHTML = `<div class="empty">Streckenvarianten werden geladen…</div>`;
    loadVariants().then(() => { if (activeBase) renderEdit(deriveRoute(activeBase)); });
    return;
  }
  const c = customFor(r.id);
  const base = activeBase;
  const km = v => v.toFixed(2).replace(".", ",");

  const vlist = variantsOf(base.id);
  const variants = `
    <div class="section-h">Streckenführung</div>
    ${vlist.length ? `
      <button class="opt-row ${c.variant === 0 ? "on" : ""}" data-var="0">
        <span class="row-ico">①</span>
        <span class="r-main"><span class="r-t">Standard</span>
          <span class="r-d">${km(base.km)} km · ${base.ascent_m} Hm · ${base.duration}</span></span>
      </button>
      ${vlist.map((v, i) => `
        <button class="opt-row ${c.variant === i + 1 ? "on" : ""}" data-var="${i + 1}">
          <span class="row-ico">${["②","③","④"][i] || "◆"}</span>
          <span class="r-main"><span class="r-t">Variante ${i + 1}</span>
            <span class="r-d">${km(v.km)} km · ${v.ascent_m} Hm · ${v.duration}
              ${v.lake_share >= .5 ? " · viel am Wasser" : ""}
              ${v.shade_share >= .3 ? " · schattig" : ""}</span></span>
        </button>`).join("")}
      ${c.variant > 0 ? `<div class="hint-box">Für Varianten sind keine
        Schattenzeiten berechnet — die gibt es nur für die Standardführung.</div>` : ""}`
      : `<div class="hint-box">Für diese Länge gibt es im Wegenetz keine zweite
         Führung, die sich wirklich unterscheidet.</div>`}`;

  const cands = startCandidates(r);
  const starts = `
    <div class="section-h">Startpunkt</div>
    <div class="hint-box">Die Runde wird so gedreht, dass sie hier beginnt und endet.
      Länge und Höhenmeter bleiben gleich.</div>
    ${cands.map(o => {
      const d = Math.round(o.at_km * 1000);
      const isOn = Math.abs((c.startDist || 0) - (o.dist === 0 ? 0 : d)) < 20;
      return `<button class="opt-row ${isOn ? "on" : ""}" data-start="${o.dist === 0 ? 0 : d}">
        <span class="row-ico">${o.icon}</span>
        <span class="r-main"><span class="r-t">${o.name}</span>
          <span class="r-d">${o.label}${o.dist === 0 ? "" : ` · bisher bei km ${km(o.at_km)}`}</span></span>
        <span class="r-x">${isOn ? "AKTIV" : "START"}</span></button>`;
    }).join("")}`;

  const spurs = `
    <div class="section-h">Abstecher</div>
    ${(r.spurs && r.spurs.length) ? r.spurs.map(sp => {
      const on = !!c.spurs[spurKey(sp)];
      return `<button class="opt-row ${on ? "on" : ""}" data-spur="${spurKey(sp)}">
        <span class="row-ico">${REST_ICON[sp.kind] || "📍"}</span>
        <span class="r-main"><span class="r-t">${sp.name}</span>
          <span class="r-d">Abzweig bei km ${km(sp.at_km)} · hin und zurück</span></span>
        <span class="delta">+${sp.detour_m} m</span></button>`;
    }).join("") : `<div class="hint-box">In Reichweite dieser Runde liegt nichts,
      wofür sich ein Umweg über echte Wege lohnt.</div>`}`;

  const mine = `
    <div class="section-h">Eigene Punkte</div>
    <div class="hint-box">OpenStreetMap kennt hier weder Wickelräume noch die WCs
      am Bootshaus. Setz dir die Punkte selbst — sie bleiben auf diesem Gerät
      gespeichert und lassen sich als Startpunkt wählen.</div>
    <div class="addbar">${MY_KINDS.map(k =>
      `<button class="chip" data-add="${k.k}">${k.i} ${k.t}</button>`).join("")}</div>
    ${myPoints.length ? myPoints.map(mp => `
      <div class="opt-row">
        <span class="row-ico">${(MY_KINDS.find(k => k.k === mp.kind) || {}).i || "📌"}</span>
        <span class="r-main"><span class="r-t">${mp.name}</span>
          <span class="r-d">${mp.lat.toFixed(5)}, ${mp.lon.toFixed(5)}</span></span>
        <button class="r-x" data-del="${mp.id}" style="color:var(--red)">LÖSCHEN</button>
      </div>`).join("") : ""}`;

  const reset = (c.variant || c.startDist || Object.keys(c.spurs).length)
    ? `<button class="btn btn-ghost" id="btn-reset-custom" style="width:100%;margin-top:14px">
         Anpassungen zurücksetzen</button>` : "";

  el.innerHTML = variants + starts + spurs + mine + reset;

  el.querySelectorAll("[data-var]").forEach(b => b.addEventListener("click", () => {
    c.variant = +b.dataset.var; c.startDist = 0; refreshActive({fly:true});
  }));
  el.querySelectorAll("[data-start]").forEach(b => b.addEventListener("click", () => {
    // die angezeigten Kilometer zaehlen ab dem aktuellen Start - fuer die
    // Speicherung muss daraus wieder ein Wert auf der Originallinie werden
    const pick = +b.dataset.start;
    if (pick === 0){ c.startDist = 0; }
    else {
      const ringLen = lineLength(r.coords);
      c.startDist = ((c.startDist || 0) + pick) % ringLen;
    }
    refreshActive({fly:true});
  }));
  el.querySelectorAll("[data-spur]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.spur;
    if (c.spurs[k]) delete c.spurs[k]; else c.spurs[k] = 1;
    refreshActive({});
  }));
  el.querySelectorAll("[data-add]").forEach(b => b.addEventListener("click", () => {
    beginAddPoint(b.dataset.add);
  }));

/* =================== Sonnenstand & Schatten =================== */
/* Das Horizontprofil je Stuetzpunkt kommt vorberechnet aus shade.py; die
   Sonnenposition wird hier gerechnet, damit Datum und Uhrzeit frei bleiben. */
function sunPosition(date, lat, lon){
  const rad = Math.PI / 180;
  const days = date.getTime() / 86400000 - 0.5 + 2440588 - 2451545;
  const M = rad * (357.5291 + 0.98560028 * days);
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const e = rad * 23.4397;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const ra = Math.atan2(Math.sin(L) * Math.cos(e), Math.cos(L));
  const H = rad * (280.16 + 360.9856235 * days) + rad * lon - ra;
  const phi = rad * lat;
  const alt = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  let az = Math.atan2(Math.sin(H), Math.cos(H) * Math.sin(phi) - Math.tan(dec) * Math.cos(phi));
  az = (az / rad + 180 + 360) % 360;
  return {alt: alt / rad, az: az};
}

/* Oesterreichische Zeit fest verdrahtet statt der Geraetezeitzone - sonst
   stimmen die Schattenzeiten nur, wenn man zufaellig in derselben Zone sitzt. */
function lastSundayUTC(year, month){
  const d = new Date(Date.UTC(year, month + 1, 0));
  d.setUTCDate(d.getUTCDate() - d.getUTCDay());
  return d;
}
function localToDate(y, m, d, hour, minute){
  const naive = Date.UTC(y, m, d, hour, minute || 0);
  const dstStart = lastSundayUTC(y, 2); dstStart.setUTCHours(1);
  const dstEnd = lastSundayUTC(y, 9); dstEnd.setUTCHours(1);
  const t = new Date(naive);
  const off = (t >= dstStart && t < dstEnd) ? 2 : 1;
  return new Date(naive - off * 3600000);
}

function shadeMask(route, when){
  const sh = route.shade;
  if (!sh || !sh.hz || !sh.hz.length) return null;
  const sun = sunPosition(when, LAKE.center[1], LAKE.center[0]);
  const n = sh.hz.length, mask = new Array(n);
  const per = 360 / sh.bins;
  for (let i = 0; i < n; i++){
    if (sun.alt <= 0 || sh.fr[i] === "1"){ mask[i] = 1; continue; }
    const b = sun.az / per;
    const b0 = Math.floor(b) % sh.bins, b1 = (b0 + 1) % sh.bins, t = b - Math.floor(b);
    const horizon = sh.hz[i][b0] * (1 - t) + sh.hz[i][b1] * t;
    mask[i] = sun.alt <= horizon ? 1 : 0;
  }
  let sum = 0; for (const m of mask) sum += m;
  return {mask, sun, frac: sum / n};
}

/* Linie nach Schatten einfaerben: jeder Streckenpunkt bekommt den Zustand
   des naechstgelegenen Stuetzpunkts. */
function shadeGeoJSON(route, mask){
  const step = route.shade.step_m;
  const shift = route.shadeShift || 0;
  const feats = [];
  let dist = 0, run = [route.coords[0]], cur = null;
  for (let i = 1; i < route.coords.length; i++){
    const a = route.coords[i - 1], b = route.coords[i];
    const dx = (b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180);
    const dy = (b[1] - a[1]) * 110540;
    const idx = ((Math.round((dist + shift) / step) % mask.length) + mask.length) % mask.length;
    const state = mask[idx];
    if (cur === null) cur = state;
    if (state !== cur){
      feats.push({type:"Feature", geometry:{type:"LineString", coordinates:run.slice()},
                  properties:{sh:cur}});
      run = [a]; cur = state;
    }
    run.push(b);
    dist += Math.hypot(dx, dy);
  }
  if (run.length > 1)
    feats.push({type:"Feature", geometry:{type:"LineString", coordinates:run},
                properties:{sh:cur === null ? 0 : cur}});
  return {type:"FeatureCollection", features:feats};
}

let shadeHour = new Date().getHours();
let shadeDate = new Date();

function shadeStrip(r){
  if (!r.shade || !r.shade.hz || !r.shade.hz.length)
    return `<div class="kw-note">Für diese Runde liegen keine Schattendaten vor.</div>`;
  const y = shadeDate.getFullYear(), m = shadeDate.getMonth(), d = shadeDate.getDate();
  const cells = [];
  let best = null;
  for (let h = 6; h <= 20; h++){
    const res = shadeMask(r, localToDate(y, m, d, h, 30));
    const pct = Math.round(res.frac * 100);
    const night = res.sun.alt <= 0;
    cells.push({h, pct, night});
    if (!night && (best === null || pct > best.pct)) best = {h, pct};
  }
  const cur = cells.find(c => c.h === shadeHour) || cells[0];
  const bars = cells.map(c => `
    <button class="sh-cell ${c.h === shadeHour ? "on" : ""}" data-hour="${c.h}"
            title="${c.h}:00 Uhr — ${c.pct} % Schatten">
      <span class="sh-bar" style="height:${Math.max(4, c.pct)}%"></span>
      <span class="sh-h">${c.h}</span>
    </button>`).join("");
  const morning = cells.filter(c => c.h <= 11 && !c.night);
  const noon = cells.filter(c => c.h > 11 && c.h <= 15 && !c.night);
  const avg = a => a.length ? Math.round(a.reduce((s, c) => s + c.pct, 0) / a.length) : 0;
  return `
    <div class="sh-legend">
      <b>${cur.pct} % im Schatten</b> um ${cur.h}:00 Uhr
      ${cur.night ? " · Sonne steht unter dem Horizont" : ""}
    </div>
    <div class="sh-strip">${bars}</div>
    <div class="kw-note">
      Vormittag (6–11 Uhr) im Mittel ${avg(morning)} % Schatten, Mittag
      (12–15 Uhr) ${avg(noon)} %.
      ${best ? `Am schattigsten ist es gegen ${best.h}:00 Uhr (${best.pct} %).` : ""}
      Gerechnet für ${String(d).padStart(2, "0")}.${String(m + 1).padStart(2, "0")}.${y}
      aus Geländehorizont und Waldflächen.
    </div>`;
}

function bindShadeStrip(r){
  document.querySelectorAll(".sh-cell").forEach(c =>
    c.addEventListener("click", () => {
      shadeHour = +c.dataset.hour;
      renderDetail(r);
      paintShade(r);
    }));
}

function paintShade(r){
  const src = map.getSource("shade");
  if (!src) return;
  if (!r || !r.shade || !r.shade.hz || !r.shade.hz.length){ src.setData(emptyFC()); return; }
  const res = shadeMask(r, localToDate(shadeDate.getFullYear(), shadeDate.getMonth(),
                                       shadeDate.getDate(), shadeHour, 30));
  src.setData(shadeGeoJSON(r, res.mask));
}

/* =================== Tour-Kamera auf festem Pfad =================== */
/* Freies Umsehen liess die Kamera in den Hang geraten - man sah durch Fels
   und Baeume hindurch. Stattdessen faehrt die Kamera jetzt auf der Runde
   selbst: Position und Blickrichtung kommen aus der Linie, die Neigung wird
   so weit zurueckgenommen, dass das Gelaende davor den Blick nicht schneidet. */
let lastProg = -1;
let tourOn = false, tourRoute = null, tourDist = 0, tourPlaying = false,
    tourLen = 0, tourCum = [], tourRaf = 0, tourLast = 0;

/* Im Rundflug muss die Strecke aus ~200 m Entfernung und schraeg von oben
   lesbar bleiben: breiter, heller, mit Richtungspfeilen. */
function setTourLineStyle(on){
  try {
    map.setPaintProperty("route-line", "line-width", on ? 7 : 4);
    map.setPaintProperty("route-glow", "line-width", on ? 20 : 11);
    map.setPaintProperty("route-glow", "line-opacity", on ? .38 : .22);
    map.setPaintProperty("route-dash", "line-width", on ? 2.4 : 1.6);
    map.setPaintProperty("route-dash", "line-opacity", on ? .95 : .75);
    map.setLayoutProperty("route-arrows", "visibility", on ? "visible" : "none");
    if (!on){
      map.setPaintProperty("route-line", "line-gradient", null);
      map.setPaintProperty("route-line", "line-color", "#4aa8ff");
      lastProg = -1;
    }
  } catch(e){}
}

function buildTourIndex(r){
  tourCum = [0];
  for (let i = 1; i < r.coords.length; i++){
    const a = r.coords[i - 1], b = r.coords[i];
    const dx = (b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180);
    const dy = (b[1] - a[1]) * 110540;
    tourCum.push(tourCum[i - 1] + Math.hypot(dx, dy));
  }
  tourLen = tourCum[tourCum.length - 1];
}

function pointAt(r, dist){
  const d = Math.max(0, Math.min(tourLen, dist));
  let lo = 0, hi = tourCum.length - 1;
  while (lo < hi - 1){
    const mid = (lo + hi) >> 1;
    if (tourCum[mid] <= d) lo = mid; else hi = mid;
  }
  const span = tourCum[hi] - tourCum[lo] || 1;
  const t = (d - tourCum[lo]) / span;
  const a = r.coords[lo], b = r.coords[hi];
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

function bearingAt(r, dist){
  // ueber 60 m mitteln, sonst zappelt die Blickrichtung an jedem Knick
  const p0 = pointAt(r, dist), p1 = pointAt(r, Math.min(tourLen, dist + 60));
  const dx = (p1[0] - p0[0]) * Math.cos(p0[1] * Math.PI / 180);
  const dy = (p1[1] - p0[1]);
  return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
}

function metersPerPixel(lat, zoom){
  return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
}

/* Neigung so waehlen, dass die Kamera ueber allem bleibt was zwischen ihr
   und dem Blickziel liegt. */
function clearPitch(lon, lat, bearing, zoom){
  const fovDeg = map.getVerticalFieldOfView ? map.getVerticalFieldOfView() : 36.87;
  const camPx = 0.5 * (map.getCanvas().clientHeight || 700) / Math.tan(fovDeg * Math.PI / 360);
  const groundZ = safeElev(lon, lat, 1100);
  for (let pitch = 74; pitch >= 50; pitch -= 4){
    const dist = camPx * metersPerPixel(lat, zoom);
    const camH = dist * Math.cos(pitch * Math.PI / 180);
    const back = dist * Math.sin(pitch * Math.PI / 180);
    const rad = (bearing + 180) * Math.PI / 180;
    let ok = true;
    for (let f = 0.25; f <= 1.0; f += 0.25){
      const rr = back * f;
      const plat = lat + (rr * Math.cos(rad)) / 110540;
      const plon = lon + (rr * Math.sin(rad)) / (111320 * Math.cos(lat * Math.PI / 180));
      const z = safeElev(plon, plat, groundZ);
      // Sichtlinie von der Kamera zum Standpunkt, 4 m Luft als Puffer
      if (z > groundZ + camH * f + 4){ ok = false; break; }
    }
    if (ok) return pitch;
  }
  return 50;
}

function safeElev(lon, lat, fallback){
  try {
    const z = map.queryTerrainElevation({lng:lon, lat:lat});
    return (z === null || z === undefined || !isFinite(z)) ? fallback : z;
  } catch(e){ return fallback; }
}

let pitchCache = 68, pitchCheckedAt = -1e9, pitchCheckedDist = -1e9;

function applyTourCamera(){
  if (!tourOn || !tourRoute) return;
  const zoom = 18.8;
  const p = pointAt(tourRoute, tourDist);
  const bear = bearingAt(tourRoute, tourDist);
  // Die Gelaendeabfrage kostet spuerbar, das Gelaende aendert sich aber nicht
  // von Bild zu Bild - hoechstens alle 15 m oder 250 ms neu bestimmen.
  const now = performance.now();
  if (Math.abs(tourDist - pitchCheckedDist) > 15 || now - pitchCheckedAt > 250){
    const target = clearPitch(p[0], p[1], bear, zoom);
    pitchCache += (target - pitchCache) * 0.5;   // weich nachziehen statt springen
    pitchCheckedAt = now;
    pitchCheckedDist = tourDist;
  }
  const pitch = pitchCache;
  const fovDeg = map.getVerticalFieldOfView ? map.getVerticalFieldOfView() : 36.87;
  const camPx = 0.5 * (map.getCanvas().clientHeight || 700) / Math.tan(fovDeg * Math.PI / 360);
  const ahead = camPx * metersPerPixel(p[1], zoom) * Math.sin(pitch * Math.PI / 180);
  const rad = bear * Math.PI / 180;
  const cLat = p[1] + (ahead * Math.cos(rad)) / 110540;
  const cLon = p[0] + (ahead * Math.sin(rad)) / (111320 * Math.cos(p[1] * Math.PI / 180));
  map.jumpTo({center:[cLon, cLat], zoom:zoom, pitch:pitch, bearing:bear});

  const posSrc = map.getSource("tourpos");
  if (posSrc) posSrc.setData({type:"Feature", geometry:{type:"Point", coordinates:p},
                              properties:{}});

  // Zurueckgelegtes gedaempft, Strecke voraus kraeftig - nur nachfuehren wenn
  // sich der Fortschritt spuerbar geaendert hat.
  const prog = tourLen ? Math.min(0.999, Math.max(0.001, tourDist / tourLen)) : 0.001;
  if (Math.abs(prog - lastProg) > 0.004){
    lastProg = prog;
    try {
      map.setPaintProperty("route-line", "line-gradient",
        ["interpolate", ["linear"], ["line-progress"],
         0, "#2a4258", Math.max(0.001, prog - 0.004), "#2a4258",
         prog, "#ffffff", Math.min(0.999, prog + 0.02), "#4aa8ff", 1, "#4aa8ff"]);
    } catch(e){}
  }
  document.getElementById("g-needle").style.transform = `rotate(${-bear}deg)`;
  document.getElementById("t-slider").value = String(Math.round(tourDist));
  document.getElementById("g-dir").textContent =
    `km ${(tourDist / 1000).toFixed(2).replace(".", ",")} von ` +
    `${(tourLen / 1000).toFixed(2).replace(".", ",")} · Blick nach ${compassName(bear)}`;
  const near = nearestSpot(p);
  document.getElementById("g-name").textContent =
    near ? `${tourRoute.name} — ${near.name}` : tourRoute.name;
}

function nearestSpot(p){
  let best = null, bd = 120;
  for (const s of SPOTS){
    const dx = (s.lon - p[0]) * 111320 * Math.cos(p[1] * Math.PI / 180);
    const dy = (s.lat - p[1]) * 110540;
    const d = Math.hypot(dx, dy);
    if (d < bd){ bd = d; best = s; }
  }
  return best;
}

async function enterTour(route, startDist){
  tourRoute = route;
  buildTourIndex(route);
  tourDist = startDist || 0;
  const load = document.getElementById("loading");
  document.getElementById("loading-txt").textContent = "Gelände wird geladen…";
  load.hidden = false;

  const p = pointAt(route, tourDist);
  map.easeTo({center:[p[0], p[1]], zoom:17.2, pitch:62, bearing:bearingAt(route, tourDist),
    duration:reduceMotion ? 0 : 1200, essential:true});
  await once(map, "moveend");
  await tilesReady(3000);

  tourOn = true;
  setTourLineStyle(true);
  map.dragPan.disable(); map.dragRotate.disable(); map.scrollZoom.disable();
  map.touchZoomRotate.disable(); map.keyboard.disable(); map.doubleClickZoom.disable();
  const sl = document.getElementById("t-slider");
  sl.max = String(Math.round(tourLen));
  sl.value = String(Math.round(tourDist));
  applyTourCamera();
  await tilesReady(2000);

  load.hidden = true;
  document.getElementById("ground").hidden = false;
  setSheet("hidden");
  lookForPhoto(nearestSpot(p) || {lat:p[1], lon:p[0]});
}

function exitTour(){
  tourOn = false; tourPlaying = false;
  setTourLineStyle(false);
  const posSrc = map.getSource("tourpos");
  if (posSrc) posSrc.setData(emptyFC());
  if (tourRaf) cancelAnimationFrame(tourRaf), tourRaf = 0;
  closePhoto();
  document.getElementById("ground").hidden = true;
  document.getElementById("g-photo-btn").hidden = true;
  document.getElementById("t-play").textContent = "▶";
  map.dragPan.enable(); map.dragRotate.enable(); map.scrollZoom.enable();
  map.touchZoomRotate.enable(); map.keyboard.enable(); map.doubleClickZoom.enable();
  if (tourRoute) selectRoute(tourRoute, {fly:true});
  setSheet("half");
}

/* Kamera nur einmal pro Bild aktualisieren statt bei jedem Eingabe-Event -
   der Schieberegler feuert sonst weit oefter als das Display zeichnet. */
let camDirty = false;
function requestCamera(){
  if (camDirty) return;
  camDirty = true;
  requestAnimationFrame(() => { camDirty = false; applyTourCamera(); });
}

function tourStep(ts){
  if (!tourPlaying){ tourRaf = 0; return; }
  const dt = tourLast ? (ts - tourLast) / 1000 : 0;
  tourLast = ts;
  tourDist += dt * 28;                  // etwa Schritttempo im Zeitraffer
  if (tourDist >= tourLen) tourDist = 0;
  applyTourCamera();
  tourRaf = requestAnimationFrame(tourStep);
}

function compassName(b){
  const n = ["Norden","Nordosten","Osten","Südosten","Süden","Südwesten","Westen","Nordwesten"];
  return n[Math.round(((b % 360) + 360) % 360 / 45) % 8];
}
function once(target, ev){ return new Promise(res => target.once(ev, res)); }
function tilesReady(maxMs){
  return new Promise(res => {
    const t0 = Date.now();
    (function check(){
      if (map.areTilesLoaded() || Date.now() - t0 > maxMs) return res();
      setTimeout(check, 120);
    })();
  });
}

/* ---- Echtes Vor-Ort-Foto (Panoramax, offen und ohne Schluessel) ---- */
let photoUrl = null;
async function lookForPhoto(s){
  const btn = document.getElementById("g-photo-btn");
  btn.hidden = true; photoUrl = null;
  if (!s) return;
  const d = 0.004;
  const bbox = [s.lon - d, s.lat - d, s.lon + d, s.lat + d].join(",");
  try {
    const r = await fetch(`https://api.panoramax.xyz/api/search?bbox=${bbox}&limit=200`);
    if (!r.ok) return;
    const j = await r.json();
    let best = null, bestD = Infinity;
    for (const f of (j.features || [])){
      const c = f.geometry && f.geometry.coordinates;
      if (!c) continue;
      const dx = (c[0] - s.lon) * 111320 * Math.cos(s.lat * Math.PI / 180);
      const dy = (c[1] - s.lat) * 110540;
      const dist = Math.hypot(dx, dy);
      if (dist < bestD){ bestD = dist; best = f; }
    }
    if (!best || bestD > 150) return;
    const asset = best.assets && (best.assets.hd || best.assets.sd || best.assets.thumb);
    if (!asset || !asset.href) return;
    photoUrl = asset.href;
    btn.hidden = false;
    btn.textContent = `Foto vor Ort (${Math.round(bestD)} m)`;
  } catch(e){ /* offline: die 3D-Ansicht bleibt nutzbar */ }
}

function openPhoto(){
  if (!photoUrl) return;
  document.getElementById("photo-img").src = photoUrl;
  document.getElementById("photo-view").hidden = false;
